<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Algoritmo de Euclides</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="tema-azul">
    <div class="container">
        <h1>🔢 Algoritmo de Euclides</h1>
        <p class="subtitle">Calcula el Máximo Común Divisor (MCD)</p>

        <div class="inputs-grid">
            <div class="input-group">
                <label>Primer número:</label>
                <input type="number" id="num1" placeholder="Ej: 108" min="1">
            </div>
            <div class="input-group">
                <label>Segundo número:</label>
                <input type="number" id="num2" placeholder="Ej: 30" min="1">
            </div>
        </div>

        <button onclick="calcular()">Calcular MCD</button>
        <div id="resultado"></div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/euclides.js"></script>
</body>
</html>
