<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Convertidor de Bases</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="tema-base">
    <div class="container">
        <h1>🔢 Convertidor de Bases</h1>
        <p class="subtitle">Bases 2 a 36</p>

        <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:30px; background:linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding:20px; border-radius:10px;">
            <div style="background:white; padding:10px 20px; border-radius:8px; text-align:center;">
                <div style="font-size:0.8em; color:#666;">Origen</div>
                <div id="displayOrigen" style="font-size:1.5em; font-weight:bold; color:#00b4db;">10</div>
            </div>
            <div style="font-size:2em; color:white;">→</div>
            <div style="background:white; padding:10px 20px; border-radius:8px; text-align:center;">
                <div style="font-size:0.8em; color:#666;">Destino</div>
                <div id="displayDestino" style="font-size:1.5em; font-weight:bold; color:#00b4db;">2</div>
            </div>
        </div>

        <div class="inputs-grid" style="grid-template-columns: 2fr 1fr 1fr;">
            <div class="input-group">
                <label>Número:</label>
                <input type="text" id="numero" placeholder="Ej: 255" value="255" style="font-family:monospace;">
            </div>
            <div class="input-group">
                <label>Base Origen:</label>
                <input type="number" id="baseOrigen" min="2" max="36" value="10">
            </div>
            <div class="input-group">
                <label>Base Destino:</label>
                <input type="number" id="baseDestino" min="2" max="36" value="2">
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="mostrarProceso" checked>
            <label for="mostrarProceso">Mostrar proceso</label>
        </div>

        <button onclick="convertirBase()">Convertir</button>
        <div id="resultado"></div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/cambio_base.js"></script>
</body>
</html>
